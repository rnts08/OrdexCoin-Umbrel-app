name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 0.1.6)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        run: |
          if [[ -n "${{ github.event.inputs.version }}" ]]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            TAG="${GITHUB_REF#refs/tags/}"
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: webapp/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ordexcoin:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/ordexcoin:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resolve image digest
        id: digest
        run: |
          DIGEST=$(docker buildx imagetools inspect ghcr.io/${{ github.repository_owner }}/ordexcoin:${{ steps.version.outputs.version }} --format '{{.Manifest.Digest}}')
          echo "digest=${DIGEST}" >> $GITHUB_OUTPUT

      - name: Update Umbrel package
        run: |
          ./scripts/update-umbrel-package.sh "${{ steps.version.outputs.version }}" "${{ steps.digest.outputs.digest }}"

      - name: Commit package updates
        env:
          GIT_TOKEN: ${{ secrets.GIT_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ordexcoin/docker-compose.yml ordexcoin/umbrel-app.yml
          git commit -m "chore: update umbrel package to ${{ steps.version.outputs.version }}"
          git push https://x-access-token:${GIT_TOKEN}@github.com/${{ github.repository }}.git HEAD:main

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
# OrdexCoin Umbrel app — compose (template).
#
# Target platform: umbrelOS on x86_64 (amd64). The container image ships the
# amd64 static daemon + the web UI. Image is public on GHCR:
#   ghcr.io/rnts08/ordexcoin:0.1.6
#
# Reference: getumbrel/umbrel-apps/bitcoin/docker-compose.yml
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ordexcoin_app_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  ordexcoin_app_1:
    image: ghcr.io/rnts08/ordexcoin:0.1.6@sha256:49145349ce840c2d8902000efa240ab33d62c3536cf421c7b33a5e2d3790ddd5
    # No `user` is set: the container starts as root so the entrypoint can
    # repair the ownership of ${APP_DATA_DIR}/data (umbrelOS and root-created
    # mounts are not writable by the runtime uid). The entrypoint then drops to
    # 1000:1000 — the umbrelOS app uid/gid — before starting the daemon, which
    # refuses to run as root.
    restart: on-failure
    stop_grace_period: 15m30s
    ports:
      # P2P must be published for inbound peers so the node can be part of the
      # network. Outbound discovery happens via the built-in DNS seeds.
      - "${APP_ORDEXCOIN_P2P_PORT}:25174"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      ORDEXCOIN_DATA: /data
      ORDEXCOIN_P2P_PORT: 25174
      ORDEXCOIN_WEB_ADDR: 0.0.0.0:3000
      # Optional: secure the web UI with basic auth using Umbrel's per-app password.
      # ORDEXCOIN_WEB_USER: umbrel
      # ORDEXCOIN_WEB_PASS: ${APP_PASSWORD}
# OrdexCoin Umbrel app — compose.
#
# Target platform: umbrelOS on x86_64 (amd64). The container image ships the
# amd64 static daemon + the web UI. Image is public on GHCR:
#   ghcr.io/rnts08/ordexcoin:0.1.0
#
# Reference: getumbrel/umbrel-apps/bitcoin/docker-compose.yml
version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: ordexcoin_app_1
      APP_PORT: 3000
      PROXY_AUTH_ADD: "false"

  app:
    image: ghcr.io/rnts08/ordexcoin:0.1.0@sha256:e37b9f1575433003be774cc45faf5fd914c24b345904a6884dc1505cb420a69d
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 15m30s
    ports:
      # P2P must be published for inbound peers so the node can be part of the
      # network. Outbound discovery happens via the built-in DNS seeds.
      - "${APP_ORDEXCOIN_P2P_PORT}:25174"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      ORDEXCOIN_DATA: /data
      ORDEXCOIN_P2P_PORT: 25174
      ORDEXCOIN_WEB_ADDR: 0.0.0.0:3000
      # Optional: secure the web UI with basic auth using Umbrel's per-app password.
      # ORDEXCOIN_WEB_USER: umbrel
      # ORDEXCOIN_WEB_PASS: ${APP_PASSWORD}
